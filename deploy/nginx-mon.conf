# Tweedle API under /mon/ - goes into the server block of nginx.conf
# (/root/pods/nginx/nginx.conf). The trailing slash in proxy_pass strips /mon.
# Tweedle runs on the host and listens on the gateway of the podman network
# (listen: podman:gaistnet:9300), which the container reaches as
# host.containers.internal.
location /mon/ {
    proxy_pass http://host.containers.internal:9300/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket /mon/api/live (the client's Connection header is "Upgrade" there)
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $http_connection;
    proxy_buffering off;
    # Tweedle pings the WebSocket every 30 s.
    proxy_read_timeout 120s;
    client_max_body_size 64k;
}
